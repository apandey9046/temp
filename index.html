<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Pro Calculator</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* --- CSS STYLING --- */
        :root {
            --bg-color: #0a0c10;          /* Deep Black */
            --card-bg: #161b22;           /* Dark Grey Container */
            --accent-color: #2f81f7;      /* Electric Blue (The "one" color) */
            --text-main: #ffffff;         /* White */
            --text-dim: #8b949e;          /* Dim Grey */
            --btn-bg: #21262d;            /* Button Grey */
            --btn-hover: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
        }

        /* Responsive Container */
        .calc-wrapper {
            width: 100%;
            max-width: 380px; /* Desktop width limit */
            background: var(--card-bg);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Screen/Display Section */
        .display-area {
            padding: 20px 10px;
            text-align: right;
            word-wrap: break-word;
            word-break: break-all;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        #history {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            min-height: 1.5rem;
        }

        #result {
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1;
        }

        /* Buttons Grid */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            outline: none;
            height: 70px;
            border-radius: 18px;
            font-size: 1.4rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--btn-bg);
            color: var(--text-main);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0) scale(0.95);
        }

        /* Special Buttons */
        .btn-accent {
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        .btn-equal {
            background: var(--accent-color);
            color: white;
        }

        .btn-equal:hover {
            background: #4493f8;
        }

        .btn-clear {
            color: #ff7b72; /* Subtle Red for clear */
        }

        /* Layout for 0 button */
        .span-two {
            grid-column: span 2;
        }

        /* Responsive Adjustments */
        @media (max-width: 400px) {
            body { padding: 0; }
            .calc-wrapper {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
            }
            button { height: 80px; }
        }
    </style>
</head>
<body>

    <div class="calc-wrapper">
        <div style="display: flex; justify-content: space-between; color: var(--text-dim);">
            <i data-lucide="menu" size="20"></i>
            <span style="font-size: 0.8rem; letter-spacing: 2px; font-weight: 600;">CALCULATOR</span>
            <i data-lucide="history" size="20"></i>
        </div>

        <div class="display-area">
            <div id="history"></div>
            <div id="result">0</div>
        </div>

        <div class="buttons-grid">
            <button class="btn-clear" onclick="allClear()">AC</button>
            <button class="btn-accent" onclick="deleteLast()">
                <i data-lucide="delete"></i>
            </button>
            <button class="btn-accent" onclick="appendOperator('%')">%</button>
            <button class="btn-accent" onclick="appendOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="btn-accent" onclick="appendOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="btn-accent" onclick="appendOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="btn-accent" onclick="appendOperator('+')">+</button>

            <button class="span-two" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        let currentDisplay = "0";
        let historyDisplay = "";
        let shouldResetScreen = false;

        const resultElement = document.getElementById('result');
        const historyElement = document.getElementById('history');

        function updateScreen() {
            // Font size adjustment for long numbers
            if (currentDisplay.length > 8) {
                resultElement.style.fontSize = "2.2rem";
            } else {
                resultElement.style.fontSize = "3.5rem";
            }
            resultElement.innerText = currentDisplay;
            historyElement.innerText = historyDisplay;
        }

        function appendNumber(num) {
            if (currentDisplay === "0" || shouldResetScreen) {
                currentDisplay = num;
                shouldResetScreen = false;
            } else {
                currentDisplay += num;
            }
            updateScreen();
        }

        function appendOperator(op) {
            if (shouldResetScreen) shouldResetScreen = false;
            // Agar last character operator hai toh change kar do
            const lastChar = currentDisplay.slice(-1);
            if (["+", "-", "*", "/", "%"].includes(lastChar)) {
                currentDisplay = currentDisplay.slice(0, -1) + op;
            } else {
                currentDisplay += op;
            }
            updateScreen();
        }

        function allClear() {
            currentDisplay = "0";
            historyDisplay = "";
            updateScreen();
        }

        function deleteLast() {
            if (currentDisplay.length === 1) {
                currentDisplay = "0";
            } else {
                currentDisplay = currentDisplay.slice(0, -1);
            }
            updateScreen();
        }

        function calculate() {
            try {
                // Replacing 'x' and '÷' visual symbols with JS operators
                let expression = currentDisplay.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(expression);

                historyDisplay = currentDisplay + " =";
                
                // Handling decimals
                if (result % 1 !== 0) {
                    result = parseFloat(result.toFixed(4));
                }
                
                currentDisplay = result.toString();
                shouldResetScreen = true;
                updateScreen();
            } catch (error) {
                currentDisplay = "Error";
                updateScreen();
                setTimeout(allClear, 1500);
            }
        }
    </script>
</body>
</html>
