<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Calculator | Touch & Keyboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* Dark Theme (Default) */
            --bg-body: #0a0c10;
            --bg-calc: #161b22;
            --btn-num: #21262d;
            --btn-op: #30363d;
            --accent: #2f81f7;
            --text-p: #ffffff;
            --text-s: #8b949e;
            --shadow: rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg-body: #f0f2f5;
            --bg-calc: #ffffff;
            --btn-num: #f6f8fa;
            --btn-op: #e6edf3;
            --accent: #0969da;
            --text-p: #1f2328;
            --text-s: #656d76;
            --shadow: rgba(0,0,0,0.1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none; /* Prevents text selection while clicking fast */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            transition: background 0.3s ease;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px;
        }

        /* Container styling */
        .calculator {
            width: 100%; max-width: 400px;
            background: var(--bg-calc);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(128,128,128,0.1);
        }

        /* Top Toolbar */
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; color: var(--text-s);
        }
        .icon-btn { cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.2s; }
        .icon-btn:hover { background: var(--btn-op); }

        /* Display Area */
        .screen {
            height: 140px;
            display: flex; flex-direction: column;
            justify-content: flex-end; align-items: flex-end;
            padding: 10px; margin-bottom: 20px;
        }
        .prev-val { font-size: 1.1rem; color: var(--text-s); min-height: 1.5rem; word-break: break-all; }
        .curr-val { font-size: 3.2rem; font-weight: 600; color: var(--text-p); transition: 0.1s; }

        /* Buttons Grid */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        
        button {
            aspect-ratio: 1/1; border: none; border-radius: 20px;
            font-size: 1.4rem; font-weight: 500; cursor: pointer;
            background: var(--btn-num); color: var(--text-p);
            transition: transform 0.05s, background 0.2s;
            display: flex; align-items: center; justify-content: center;
        }

        button:active { transform: scale(0.92); filter: brightness(1.2); }

        .op-btn { color: var(--accent); background: var(--btn-op); font-size: 1.6rem; }
        .eq-btn { background: var(--accent); color: white; }
        .clear-btn { color: #f85149; }
        .span-2 { grid-column: span 2; aspect-ratio: auto; }

        /* History Panel */
        .history-panel {
            position: absolute; top: -100%; left: 0; width: 100%; height: 100%;
            background: var(--bg-calc); z-index: 10;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px; display: flex; flex-direction: column;
        }
        .history-panel.active { top: 0; }
        .history-list { flex: 1; overflow-y: auto; margin-top: 15px; }
        .history-item { 
            padding: 12px; border-bottom: 1px solid rgba(128,128,128,0.1);
            text-align: right; animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } }

        /* Desktop Keyboard Hint */
        .kb-hint {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            font-size: 0.7rem; color: var(--text-s); opacity: 0.5;
        }

        @media (max-width: 480px) {
            body { padding: 0; }
            .calculator { max-width: 100%; height: 100vh; border-radius: 0; display: flex; flex-direction: column; }
            .grid { flex: 1; align-content: center; }
            .kb-hint { display: none; }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="history-panel" id="historyPanel">
            <div class="toolbar">
                <h3 style="color: var(--text-p)">History</h3>
                <i data-lucide="x" class="icon-btn" onclick="toggleHistory()"></i>
            </div>
            <div class="history-list" id="historyList">
                <p style="text-align:center; color:var(--text-s); margin-top:20px;">No history yet</p>
            </div>
            <button class="op-btn" style="height:50px; aspect-ratio:auto; font-size:1rem" onclick="clearHistory()">Clear History</button>
        </div>

        <div class="toolbar">
            <i data-lucide="moon" class="icon-btn theme-toggle" onclick="toggleTheme()"></i>
            <span style="letter-spacing: 2px; font-weight:600; font-size:0.7rem; opacity:0.6">CASIO PRO</span>
            <i data-lucide="history" class="icon-btn" onclick="toggleHistory()"></i>
        </div>

        <div class="screen">
            <div class="prev-val" id="prevDisplay"></div>
            <div class="curr-val" id="currDisplay">0</div>
        </div>

        <div class="grid">
            <button class="op-btn clear-btn" onclick="allClear()">AC</button>
            <button class="op-btn" onclick="deleteLast()"><i data-lucide="delete"></i></button>
            <button class="op-btn" onclick="setOp('%')">%</button>
            <button class="op-btn" onclick="setOp('/')">÷</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="op-btn" onclick="setOp('*')">×</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="op-btn" onclick="setOp('-')">−</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button class="op-btn" onclick="setOp('+')">+</button>

            <button class="span-2" onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button class="eq-btn" onclick="solve()">=</button>
        </div>

        <div class="kb-hint">Keyboard support enabled (0-9, +, -, *, /, Enter, Backspace)</div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        let current = '0';
        let previous = '';
        let operation = null;
        let history = JSON.parse(localStorage.getItem('calc_history')) || [];

        const currText = document.getElementById('currDisplay');
        const prevText = document.getElementById('prevDisplay');
        const historyList = document.getElementById('historyList');

        // --- Core Logic ---
        function append(num) {
            if (num === '.' && current.includes('.')) return;
            if (current === '0' && num !== '.') current = num;
            else current += num;
            updateDisplay();
        }

        function setOp(op) {
            if (current === '') return;
            if (previous !== '') solve(false);
            operation = op;
            previous = current;
            current = '';
            updateDisplay();
        }

        function solve(saveToHistory = true) {
            let result;
            const prev = parseFloat(previous);
            const curr = parseFloat(current);
            if (isNaN(prev) || isNaN(curr)) return;

            switch (operation) {
                case '+': result = prev + curr; break;
                case '-': result = prev - curr; break;
                case '*': result = prev * curr; break;
                case '/': result = curr === 0 ? 'Error' : prev / curr; break;
                case '%': result = prev % curr; break;
                default: return;
            }

            if (saveToHistory) {
                const entry = `${previous} ${operation} ${current} = ${result}`;
                addHistory(entry);
            }

            current = result.toString();
            operation = undefined;
            previous = '';
            updateDisplay();
        }

        function allClear() {
            current = '0'; previous = ''; operation = null;
            updateDisplay();
        }

        function deleteLast() {
            current = current.toString().slice(0, -1);
            if (current === '') current = '0';
            updateDisplay();
        }

        function updateDisplay() {
            currText.innerText = current;
            if (operation != null) {
                prevText.innerText = `${previous} ${operation}`;
            } else {
                prevText.innerText = '';
            }
            // Dynamic font sizing
            currText.style.fontSize = current.length > 9 ? '1.8rem' : '3.2rem';
        }

        // --- Theme & UI ---
        function toggleTheme() {
            const theme = document.documentElement.getAttribute('data-theme');
            const newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            const icon = document.querySelector('.theme-toggle');
            icon.setAttribute('data-lucide', newTheme === 'dark' ? 'moon' : 'sun');
            lucide.createIcons();
        }

        function toggleHistory() {
            document.getElementById('historyPanel').classList.toggle('active');
            renderHistory();
        }

        function addHistory(entry) {
            history.unshift(entry);
            if (history.length > 20) history.pop();
            localStorage.setItem('calc_history', JSON.stringify(history));
        }

        function renderHistory() {
            historyList.innerHTML = history.length === 0 ? 
                '<p style="text-align:center; color:var(--text-s); margin-top:20px;">No history</p>' : 
                history.map(item => `<div class="history-item"><div style="color:var(--text-s);font-size:0.8rem">${item.split('=')[0]}</div><div style="font-weight:600; color:var(--accent)">= ${item.split('=')[1]}</div></div>`).join('');
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('calc_history');
            renderHistory();
        }

        // --- Keyboard Support ---
        window.addEventListener('keydown', (e) => {
            if (e.key >= 0 && e.key <= 9) append(e.key);
            if (e.key === '.') append('.');
            if (e.key === '+') setOp('+');
            if (e.key === '-') setOp('-');
            if (e.key === '*') setOp('*');
            if (e.key === '/') setOp('/');
            if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); solve(); }
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') allClear();
        });

    </script>
</body>
</html>
