<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Bento App Showcase</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08);
            --card-purple: #e3d5ff;
            --card-green-light: #d0f4de;
            --card-yellow: #fefae0;
            --card-mint: #bbf7d0;
            --gap: 20px;
            --radius: 32px; 
            --inner-radius: 16px;
            --smooth-bezier: cubic-bezier(0.25, 0.8, 0.25, 1);
            --accent: #00bef8;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #ececec;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #888;
            font-size: 15px;
        }

        /* --- Premium Control Panel --- */
        .controls {
            background: var(--panel-bg);
            border: 1px solid var(--border-light);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 24px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .layout-selector {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .layout-selector strong {
            margin-right: 10px;
            color: #bbb;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid var(--border-light);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s var(--smooth-bezier);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        button.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 8px 16px rgba(0, 190, 248, 0.3);
        }

        /* --- Sleek Upload Zone --- */
        .upload-zone {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .upload-box {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-light);
            padding: 16px 10px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .upload-box:hover {
            border-color: var(--accent);
            background: rgba(0, 190, 248, 0.05);
        }

        .upload-box input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            top: 0;
            left: 0;
        }

        .upload-label {
            font-size: 13px;
            font-weight: 600;
            color: #ccc;
            pointer-events: none;
        }

        .file-name {
            font-size: 11px;
            color: var(--accent);
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            pointer-events: none;
        }

        /* --- Dynamic Grid System --- */
        .grid-container {
            display: grid;
            width: 100%;
            max-width: 1200px;
            gap: var(--gap);
            transition: all 0.6s var(--smooth-bezier);
        }

        /* Premium Base Grid Cell Styles (The Color Trays) */
        .grid-item {
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            padding: 24px; /* INNER PADDING: Keeps images away from the edges */
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-light);
            transition: transform 0.4s var(--smooth-bezier), 
                        box-shadow 0.4s var(--smooth-bezier), 
                        grid-column 0.6s var(--smooth-bezier), 
                        grid-row 0.6s var(--smooth-bezier);
        }

        /* Inner Image Wrapper (Where the upload actually goes) */
        .image-wrapper {
            width: 100%;
            height: 100%;
            border-radius: var(--inner-radius);
            background-size: contain; /* Prevents app screens from cropping */
            background-position: center;
            background-repeat: no-repeat;
            z-index: 2;
            transition: all 0.4s ease;
        }

        /* Hover Lift Effect */
        .grid-item:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            z-index: 5;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .grid-item:hover .image-wrapper {
            transform: scale(1.03); /* Subtle inner image zoom */
        }

        /* Glassmorphism Frame Numbering Badge */
        .frame-number {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .placeholder-text {
            position: absolute;
            color: rgba(0,0,0,0.4);
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 1;
        }

        /* -------------------------------------------
           LAYOUT 1: Inspired by your Bento Sample
        ---------------------------------------------- */
        .layout-style-1 {
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(160px, auto);
        }
        .layout-style-1 .item-1 { grid-column: 1 / 2; grid-row: span 1; background-color: var(--card-purple); }
        .layout-style-1 .item-2 { grid-column: 2 / 3; grid-row: span 2; background-color: var(--card-green-light); }
        .layout-style-1 .item-3 { grid-column: 3 / 4; grid-row: span 1; background-color: var(--card-green-light); }
        .layout-style-1 .item-4 { grid-column: 4 / 5; grid-row: span 1; background-color: var(--card-yellow); }
        .layout-style-1 .item-5 { grid-column: 1 / 2; grid-row: span 2; background-color: var(--card-purple); }
        .layout-style-1 .item-6 { grid-column: 3 / 4; grid-row: span 1; background-color: var(--card-green-light); }
        .layout-style-1 .item-7 { grid-column: 4 / 5; grid-row: span 2; background-color: var(--card-yellow); }
        .layout-style-1 .item-8 { grid-column: 2 / 4; grid-row: span 2; background-color: var(--card-mint); }
        .layout-style-1 .item-9 { grid-column: 1 / 2; grid-row: span 1; background-color: var(--card-purple); }

        /* -------------------------------------------
           LAYOUT 2: Horizontal Focus / Alternate 
        ---------------------------------------------- */
        .layout-style-2 {
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(200px, auto);
        }
        .layout-style-2 .item-1 { grid-column: 1 / 3; background-color: var(--card-green-light); }
        .layout-style-2 .item-2 { grid-column: 3 / 4; grid-row: span 2; background-color: var(--card-yellow); }
        .layout-style-2 .item-3 { grid-column: 1 / 2; background-color: var(--card-purple); }
        .layout-style-2 .item-4 { grid-column: 2 / 3; background-color: var(--card-green-light); }
        .layout-style-2 .item-5 { grid-column: 1 / 3; grid-row: span 2; background-color: var(--card-mint); }
        .layout-style-2 .item-6 { grid-column: 3 / 4; background-color: var(--card-purple); }
        .layout-style-2 .item-7 { grid-column: 3 / 4; background-color: var(--card-yellow); }
        .layout-style-2 .item-8 { grid-column: 1 / 2; background-color: var(--card-green-light); }
        .layout-style-2 .item-9 { grid-column: 2 / 4; background-color: var(--card-purple); }

        /* -------------------------------------------
           LAYOUT 3: Split Columns (Left vs Right)
        ---------------------------------------------- */
        .layout-style-3 {
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(180px, auto);
        }
        .layout-style-3 .item-1 { grid-column: 1 / 3; grid-row: span 2; background-color: var(--card-yellow); }
        .layout-style-3 .item-2 { grid-column: 3 / 4; background-color: var(--card-purple); }
        .layout-style-3 .item-3 { grid-column: 4 / 5; background-color: var(--card-green-light); }
        .layout-style-3 .item-4 { grid-column: 3 / 5; background-color: var(--card-purple); }
        .layout-style-3 .item-5 { grid-column: 1 / 2; background-color: var(--card-green-light); }
        .layout-style-3 .item-6 { grid-column: 2 / 3; background-color: var(--card-yellow); }
        .layout-style-3 .item-7 { grid-column: 3 / 5; grid-row: span 2; background-color: var(--card-mint); }
        .layout-style-3 .item-8 { grid-column: 1 / 3; background-color: var(--card-purple); }
        .layout-style-3 .item-9 { grid-column: 1 / 5; min-height: 120px; background-color: var(--card-green-light); }

        /* Responsive */
        @media (max-width: 768px) {
            .layout-style-1, .layout-style-2, .layout-style-3 {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: minmax(140px, auto);
            }
            .grid-item {
                grid-column: span 1 !important;
                grid-row: span 1 !important;
                padding: 12px; /* Less padding on mobile */
            }
            .item-1, .item-5, .item-8 { grid-column: span 2 !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Premium App Showcase</h1>
        <p>Upload UI screens to frames and shuffle layouts instantly.</p>
    </header>

    <div class="controls">
        <div class="layout-selector">
            <strong>Layout Mode:</strong>
            <button onclick="changeLayout(1)" id="btn-1" class="active">Bento Classic</button>
            <button onclick="changeLayout(2)" id="btn-2">Asymmetric</button>
            <button onclick="changeLayout(3)" id="btn-3">Hero Focus</button>
        </div>
        
        <div style="height: 1px; background: var(--border-light); width: 100%;"></div>
        
        <div class="upload-zone" id="uploadZone"></div>
    </div>

    <div class="grid-container layout-style-1" id="showcaseGrid">
        <div class="grid-item item-1" id="frame-1">
            <span class="frame-number">1</span>
            <div class="placeholder-text">Frame 1</div>
            <div class="image-wrapper"></div>
        </div>
        <div class="grid-item item-2" id="frame-2">
            <span class="frame-number">2</span>
            <div class="placeholder-text">Frame 2</div>
            <div class="image-wrapper"></div>
        </div>
        <div class="grid-item item-3" id="frame-3">
            <span class="frame-number">3</span>
            <div class="placeholder-text">Frame 3</div>
            <div class="image-wrapper"></div>
        </div>
        <div class="grid-item item-4" id="frame-4">
            <span class="frame-number">4</span>
            <div class="placeholder-text">Frame 4</div>
            <div class="image-wrapper"></div>
        </div>
        <div class="grid-item item-5" id="frame-5">
            <span class="frame-number">5</span>
            <div class="placeholder-text">Frame 5</div>
            <div class="image-wrapper"></div>
        </div>
        <div class="grid-item item-6" id="frame-6">
            <span class="frame-number">6</span>
            <div class="placeholder-text">Frame 6</div>
            <div class="image-wrapper"></div>
        </div>
        <div class="grid-item item-7" id="frame-7">
            <span class="frame-number">7</span>
            <div class="placeholder-text">Frame 7</div>
            <div class="image-wrapper"></div>
        </div>
        <div class="grid-item item-8" id="frame-8">
            <span class="frame-number">8</span>
            <div class="placeholder-text">Frame 8</div>
            <div class="image-wrapper"></div>
        </div>
        <div class="grid-item item-9" id="frame-9">
            <span class="frame-number">9</span>
            <div class="placeholder-text">Frame 9</div>
            <div class="image-wrapper"></div>
        </div>
    </div>

    <script>
        const totalFrames = 9;

        // Build premium control dashboard inputs
        const uploadZone = document.getElementById('uploadZone');
        for (let i = 1; i <= totalFrames; i++) {
            const box = document.createElement('div');
            box.className = 'upload-box';
            box.innerHTML = `
                <span class="upload-label">Frame ${i}</span>
                <span class="file-name" id="filename-${i}">Click to upload</span>
                <input type="file" accept="image/*" onchange="handleImageUpload(event, ${i})">
            `;
            uploadZone.appendChild(box);
        }

        // Handle Image Previews
        function handleImageUpload(event, frameId) {
            const file = event.target.files[0];
            if (file) {
                // Update file name in UI
                document.getElementById(`filename-${frameId}`).textContent = file.name;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const targetFrame = document.getElementById(`frame-${frameId}`);
                    
                    // APPLY IMAGE TO THE WRAPPER, NOT THE COLORED CARD
                    const imageWrapper = targetFrame.querySelector('.image-wrapper');
                    imageWrapper.style.backgroundImage = `url('${e.target.result}')`;
                    
                    // Hide placeholder text
                    const pText = targetFrame.querySelector('.placeholder-text');
                    if (pText) pText.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        // Shuffle layouts with smooth transitions
        function changeLayout(styleNum) {
            const grid = document.getElementById('showcaseGrid');
            
            grid.classList.remove('layout-style-1', 'layout-style-2', 'layout-style-3');
            grid.classList.add(`layout-style-${styleNum}`);

            // Toggle active button states
            document.querySelectorAll('.layout-selector button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${styleNum}`).classList.add('active');
        }
    </script>
</body>
</html>
